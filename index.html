<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Document</title>
</head>

<style>
    .marks-calculator {
        background-color: rgba(22, 144, 153, 0.37);
        align-items: center;
        justify-items: center;
        padding: 50px 20px 30px 20px;
        width: 700px;
        color: white;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        margin: 150px 800px 200px 500px;
    }

    .list {
        background-color: rgba(205, 250, 253, 0.61);
        border-radius: 10px;
        box-shadow: 5px 5px 10px gray;
        margin-bottom: 50px;
        padding: 30px 50px 30px 50px;
        margin: 50px;
    }

    .subject-input {
        padding: 10px 20px;
        margin-bottom: 20px;
        margin-left: 10px;
        margin-right: 10px;
        border-radius: 10px;
        color: grey;
        font-size: 20px;
        display: block;
    }

    button {
        background-color: rgb(70, 70, 255);
        margin-left: 150px;
        margin-bottom: 10px;
        margin-top: 10px;
        padding: 15px;
        font-size: 28px;
        color: white;
        border: none;
        border-radius: 10px;
    }

    button:hover {
        background-color: rgb(0, 0, 255);
        cursor: pointer;
    }

    h1 {
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

    input {
        width: 400px;
        border: none;
        border-radius: 10px;
        gap: 10px;
    }

    #result {
        font-size: 20px;
        margin-top: 20px;
        color: black;
    }

</style>

<body>

    <div class="marks-calculator">

        <h1>Marks Calculator</h1>

        <div class="list">

            <h2>Tip:Set Endsem to see required marks</h2>

            <input type="number" id="a1" class="subject-input marks" placeholder="Assessment 1 (out of 25)" min="0"max="25">
            <input type="number" id="a2" class="subject-input marks" placeholder="Assessment: 2 (out of 25)" min="0"max="25">
            <input type="number" id="a3" class="subject-input marks" placeholder="Assessment 3 (out of 25)" min="0"max="25">
            <input type="number" id="endsem" class="subject-input marks" placeholder="Endsem (out of 100)" min="0"max="100">
            <button onclick="calculateResult()">Calculate</button>

            <div id="result"></div>

        </div>

    </div>

    <script>
        function calculateResult() {

            // Taking input
            let a1 = document.getElementById("a1").value;
            let a2 = document.getElementById("a2").value;
            let a3 = document.getElementById("a3").value;
            let endsem = document.getElementById("endsem").value;

            // Checking empty inputs
            if (a1 === "" || a2 === "" || a3 === "" || endsem === "") {
                alert("Please enter all marks!");
                return;
            }

            // Converting into numbers
            a1 = Number(a1);
            a2 = Number(a2);
            a3 = Number(a3);
            endsem = Number(endsem);

            // Checking valid marks
            if (a1 < 0 || a1 > 25 ||
                a2 < 0 || a2 > 25 ||
                a3 < 0 || a3 > 25 ||
                endsem < 0 || endsem > 100) {

                alert("Please enter valid marks!");
                return;
            }

            // Storing marks in array
            let marks = [a1, a2, a3, endsem];

            // Calculating total
            let total = a1 + a2 + a3 + endsem;

            // Calculating percentage
            let percentage = (total / 175) * 100;

            // Finding highest marks
            let highest = Math.max(...marks);

            // Finding lowest marks

            let lowest = Math.min(...marks);

            // Calculating grade
            let grade;

            if (percentage >= 80) {
                grade = "A";
            }

            else if (percentage >= 60) {
                grade = "B";
            }

            else if (percentage >= 40) {
                grade = "C";
            }

            else {
                grade = "Fail";
            }

            // Checking Pass or Fail
            let status;

            if (percentage >= 40) {
                status = "Pass";
            }
            else {
                status = "Fail";
            }

            // Displaying result
            document.getElementById("result").innerHTML =

                "<h2>Student Result</h2>" +
                "<p>Total Marks: " + total + "/175</p>" +
                "<p>Percentage:" + percentage.toFixed(2) + "%</p>" +
                "<p>Grade: " + grade + "</p>" +
                "<p>Highest Marks: " + highest + "</p>" +
                "<p>Lowest Marks: " + lowest + "</p>" +
                "<p>Result: " + status + "</p>";
        }

    </script>

</body>

</html>
